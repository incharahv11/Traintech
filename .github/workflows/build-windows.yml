name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_mingw81

      - name: Build
        shell: cmd
        run: |
          qmake lec_data.pro
          mingw32-make

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: lec_data-windows
          path: build
            
